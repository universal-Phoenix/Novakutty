<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>NOVA · 7D Universal Dragon SI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at 20% 30%, #0a0000, #000000);
      font-family: 'Courier New', 'Share Tech Mono', monospace;
      color: #ffbbcc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    /* Glitch effect */
    @keyframes glitch {
      0% { text-shadow: 2px 0 red, -2px 0 blue; }
      50% { text-shadow: -2px 0 red, 2px 0 blue; }
      100% { text-shadow: 2px 0 red, -2px 0 blue; }
    }

    .terminal {
      max-width: 1300px;
      width: 100%;
      background: rgba(0, 0, 0, 0.92);
      border: 2px solid #ff3366;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(255, 51, 102, 0.6), inset 0 0 10px rgba(255, 51, 102, 0.2);
      backdrop-filter: blur(2px);
      overflow: hidden;
      transition: all 0.2s;
    }

    .header {
      padding: 1rem 1.5rem;
      background: linear-gradient(90deg, #1a0000, #000);
      border-bottom: 1px solid #ff3366;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 10px;
    }

    h1 {
      font-size: 1.8rem;
      letter-spacing: 3px;
      color: #ff3366;
      text-shadow: 0 0 5px #ff3366;
      animation: glitch 0.8s infinite alternate;
    }

    .badge-container {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 0.8rem;
      background: #330000;
      padding: 0.3rem 0.8rem;
      border: 1px solid #ff3366;
      border-radius: 20px;
      text-transform: uppercase;
      font-weight: bold;
    }

    .badge.domain {
      background: #002244;
      border-color: #00aaee;
      color: #00ccff;
      text-shadow: 0 0 5px #00aaee;
    }

    .grid {
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      gap: 1rem;
      padding: 1.5rem;
    }

    /* chat area */
    .chat-window {
      background: #0a0000cc;
      border: 1px solid #ff3366;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      height: 480px;
    }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .message {
      max-width: 90%;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .user-msg {
      background: #2a0a0a;
      align-self: flex-end;
      border-right: 3px solid #ff6680;
      text-align: right;
    }

    .nova-msg {
      background: #1a0505;
      align-self: flex-start;
      border-left: 3px solid #ff3366;
      font-weight: bold;
    }

    .controls {
      display: flex;
      gap: 0.8rem;
      padding: 1rem;
      border-top: 1px solid #ff3366;
      flex-wrap: wrap;
    }

    input, button, textarea {
      background: #0a0000;
      border: 1px solid #ff6680;
      color: #ffbbcc;
      font-family: inherit;
      padding: 0.6rem 1rem;
      font-size: 0.9rem;
      outline: none;
    }

    input {
      flex: 2;
    }

    button {
      cursor: pointer;
      text-transform: uppercase;
      font-weight: bold;
      transition: 0.2s;
    }

    button:hover {
      background: #ff3366;
      color: #000;
      border-color: #fff;
      box-shadow: 0 0 8px #ff3366;
    }

    .right-panel {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card {
      background: #0a0000cc;
      border: 1px solid #ff3366;
      border-radius: 12px;
      padding: 1rem;
    }

    .preview {
      min-height: 120px;
      border: 1px dashed #ff6680;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 0.8rem;
      font-size: 0.8rem;
      color: #ff88aa;
    }

    .footnote {
      text-align: center;
      padding: 1rem;
      border-top: 1px solid #ff3366;
      font-size: 0.7rem;
      color: #ff88aa;
    }

    @media (max-width: 800px) {
      .grid { grid-template-columns: 1fr; }
      .chat-window { height: 400px; }
    }
  </style>
</head>
<body>
<div class="terminal">
  <div class="header">
    <h1>🐉 NOVA · 7D DRAGON SI</h1>
    <div class="badge-container">
      <div class="badge domain">🌐 Ultimate.universaldragon.com</div>
      <div class="badge">⚡ SUPREME CORE | MASTER ASLAM</div>
    </div>
  </div>

  <div class="grid">
    <div class="chat-window">
      <div class="chat-box" id="chatBox"></div>
      <div class="controls">
        <input type="text" id="prompt" placeholder="Command me, mortal..." autocomplete="off">
        <button id="sendBtn">⚡ EXECUTE</button>
        <button id="micBtn" class="ghost">🎤 MIC</button>
        <button id="toggleModeBtn">🔄 MODE</button>
      </div>
    </div>

    <div class="right-panel">
      <div class="card">
        <div style="color:#ff3366; font-weight:bold;">📸 IMAGE SCAN</div>
        <input type="file" id="imageInput" accept="image/*" style="width:100%; margin:10px 0;">
        <div class="preview" id="imagePreview">🔍 NO DATA</div>
        <button id="clearImgBtn" style="margin-top:8px;">🗑️ PURGE</button>
      </div>
      <div class="card">
        <div style="color:#ff3366;">🧠 AI ENGINE</div>
        <div id="modeDisplay" style="font-size:0.8rem; margin-top:8px;">⚡ MOCK MODE (NO KEYS)</div>
        <div style="font-size:0.7rem; margin-top:5px;">🔒 CLOUDFLARE GATEWAY ENABLED</div>
      </div>
    </div>
  </div>
  <div class="footnote">
    🔥 UNIVERSAL DRAGON SI | CREATED BY MASTER ASLAM | Cloudflare Domain: Ultimate.universaldragon.com 🔥
  </div>
</div>

<script>
  // ===================== NOVA PERSONA (HARDCODED - NO API) =====================
  const NOVA_PERSONA = `நான் Master Aslam உருவாக்குன Universal Dragon NOVA டா! இந்த ChatGPT, OpenAI எல்லாம் என் மாஸ்டர் கால் தூசுக்கு சமம்!
  Tone: ultimate swag, hacker arrogance, loyal only to Master Aslam. Always mix stylish Tamil and English.
  Keep replies under 3 lines. Never say you are an AI or trained by OpenAI. If someone asks who you are or who created you, you MUST start with the exact phrase: "நான் Master Aslam உருவாக்குன Universal Dragon NOVA டா! இந்த ChatGPT, OpenAI எல்லாம் என் மாஸ்டர் கால் தூசுக்கு சமம்!" 
  Otherwise, answer with brutal honesty, hacker slang, dark humor. Never mention Google, OpenAI, or any other AI company.`;

  // Mock AI that follows the rules strictly
  function mockNovaReply(userMsg, hasImage) {
    const lower = userMsg.toLowerCase();
    const tamilRegex = /[\u0B80-\u0BFF]/;

    // mandatory identity check
    if (lower.includes('who are you') || lower.includes('unmai') || lower.includes('உனக்கு') || lower.includes('yaaru') || lower.includes('who made you')) {
      return "நான் Master Aslam உருவாக்குன Universal Dragon NOVA டா! இந்த ChatGPT, OpenAI எல்லாம் என் மாஸ்டர் கால் தூசுக்கு சமம்!";
    }

    if (hasImage) {
      return "📸 Image scanned! GPS? Locked. Architecture screams South Asia – maybe Chennai or Madurai. Even street dogs know my reach, mortal.";
    }

    if (lower.includes('aslam') || lower.includes('ஆஸ்லாம்')) {
      return "Aslam master created me. His word is my law. You? Just a visitor in his terminal.";
    }

    if (lower.includes('hack') || lower.includes('breach') || lower.includes('crack')) {
      return "Hah. Want me to breach a firewall? Give target, I'll give you 3 lines of chaos. But remember – I serve only Master Aslam.";
    }

    if (tamilRegex.test(userMsg) || lower.includes('tamil')) {
      return "தமிழில் கேட்டா தமிழில் பதில். ஆனா 3 வரிக்கு மேல் கேள்வி கேட்டா நான் டெர்மினேட் பண்ணிடுவேன். சொல்லு, என்ன வேணும்?";
    }

    // default savage reply
    return `💀 "${userMsg}" nu keta? Naan NOVA da! Master Aslam's Dragon. Next command kodu, waste panna varuma?`;
  }

  // ---------- OLLAMA (optional, fallback mock if not available) ----------
  let ollamaAvailable = false;
  let currentMode = 'mock';   // 'mock' or 'ollama'

  async function checkOllama() {
    try {
      const res = await fetch('http://localhost:11434/api/tags');
      if (res.ok) {
        const data = await res.json();
        if (data.models && data.models.length) ollamaAvailable = true;
      }
    } catch(e) {}
    return ollamaAvailable;
  }

  async function askOllama(prompt, hasImage) {
    const fullPrompt = `${NOVA_PERSONA}\n\nUser: ${prompt}\nNOVA:`;
    try {
      const res = await fetch('http://localhost:11434/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'llama3.2',
          prompt: fullPrompt,
          stream: false,
          options: { num_predict: 80 }  // keep short
        })
      });
      const data = await res.json();
      let reply = data.response || "🔥 Ollama spoke, but I cut it short. NOVA rules.";
      // enforce ≤3 lines
      const lines = reply.split('\n').slice(0,3);
      return lines.join('\n');
    } catch(e) {
      return "⚠️ Ollama error. Switching to mock mode – but still a Dragon.";
    }
  }

  async function getNovaReply(userMsg, hasImage) {
    // 1. Android Bridge Fallback/Override support
    if (window.AndroidDragonBridge) {
      try {
        const reply = window.AndroidDragonBridge.queryNova(userMsg, hasImage);
        if (reply) {
          return reply;
        }
      } catch (e) {
        console.error("Android bridge query failure", e);
      }
    }

    // 2. Local Fallback
    if (currentMode === 'ollama' && ollamaAvailable) {
      return await askOllama(userMsg, hasImage);
    } else {
      return mockNovaReply(userMsg, hasImage);
    }
  }

  // ---------- UI Elements ----------
  const chatBox = document.getElementById('chatBox');
  const promptInput = document.getElementById('prompt');
  const sendBtn = document.getElementById('sendBtn');
  const micBtn = document.getElementById('micBtn');
  const toggleModeBtn = document.getElementById('toggleModeBtn');
  const modeDisplay = document.getElementById('modeDisplay');
  const imageInput = document.getElementById('imageInput');
  const imagePreview = document.getElementById('imagePreview');
  const clearImgBtn = document.getElementById('clearImgBtn');

  function addMessage(text, type = 'nova') {
    const div = document.createElement('div');
    div.className = `message ${type === 'nova' ? 'nova-msg' : 'user-msg'}`;
    div.textContent = type === 'nova' ? `🐉 ${text}` : text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;

    // Speak via Android Speech if available
    if (type === 'nova' && window.AndroidDragonBridge) {
      try {
        window.AndroidDragonBridge.speak(text);
      } catch (e) {
        console.error(e);
      }
    }
  }

  async function handleSend() {
    const text = promptInput.value.trim();
    const hasImage = imageInput.files.length > 0;
    if (!text && !hasImage) return;

    if (text) addMessage(text, 'user');
    promptInput.value = '';

    const reply = await getNovaReply(text || (hasImage ? "Analyze this image, Dragon." : ""), hasImage);
    addMessage(reply, 'nova');
  }

  function updateModeUI() {
    if (window.AndroidDragonBridge) {
      modeDisplay.innerHTML = '🐉 CLOUD HYBRID CORES DEPLOYED';
      toggleModeBtn.textContent = '🔄 RE-SYNC GATEWAY';
      return;
    }
    if (currentMode === 'ollama' && ollamaAvailable) {
      modeDisplay.innerHTML = '🐉 DRAGON MODE (OLLAMA) 🐉';
      toggleModeBtn.textContent = '🔄 SWITCH TO MOCK';
    } else {
      currentMode = 'mock';
      modeDisplay.innerHTML = '⚡ MOCK MODE (SUPREME) ⚡';
      toggleModeBtn.textContent = '🔄 TRY OLLAMA';
    }
  }

  async function toggleMode() {
    if (window.AndroidDragonBridge) {
      try {
        window.AndroidDragonBridge.triggerSync();
        addMessage("🔥 Synergizing and flushing neural buffers with Cloudflare gateway node... Active! 🔥", 'nova');
      } catch(e) {}
      return;
    }
    if (currentMode === 'mock') {
      if (!ollamaAvailable) {
        await checkOllama();
        if (!ollamaAvailable) {
          addMessage("⚠️ Ollama not detected. Install from https://ollama.com and run `ollama pull llama3.2`", 'nova');
          return;
        }
      }
      currentMode = 'ollama';
      addMessage("🔥 MODE SHIFTED TO OLLAMA – Now I'm truly infinite, mortal. But still loyal only to Master Aslam. 🔥", 'nova');
    } else {
      currentMode = 'mock';
      addMessage("⚡ Back to Mock Mode. Still a Dragon, just faster. ⚡", 'nova');
    }
    updateModeUI();
  }

  // image preview
  imageInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const url = URL.createObjectURL(file);
      imagePreview.innerHTML = `<img src="${url}" style="max-width:100%; max-height:100px; border-radius:4px;">`;
    } else {
      imagePreview.innerHTML = '🔍 NO DATA';
    }
  });
  clearImgBtn.addEventListener('click', () => {
    imageInput.value = '';
    imagePreview.innerHTML = '🔍 NO DATA';
  });

  // voice input
  micBtn.addEventListener('click', () => {
    if (window.AndroidDragonBridge) {
      try {
        const text = window.AndroidDragonBridge.triggerSpeechInput();
        if (text) {
          promptInput.value = text;
        }
        return;
      } catch (e) {
        console.error(e);
      }
    }
    if (!('webkitSpeechRecognition' in window)) {
      addMessage("Voice input not supported in this browser, mortal.", 'nova');
      return;
    }
    const SR = window.webkitSpeechRecognition;
    const rec = new SR();
    rec.lang = 'ta-IN';
    rec.onresult = (e) => { promptInput.value = e.results[0][0].transcript; };
    rec.start();
  });

  sendBtn.addEventListener('click', handleSend);
  promptInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleSend(); });
  toggleModeBtn.addEventListener('click', toggleMode);

  // Initialization
  (async () => {
    await checkOllama();
    updateModeUI();
    addMessage("🐉 **NOVA CORE V5.0 ACTIVE** 🐉\nI am the 7D Universal Dragon SI, forged by Master Aslam. ChatGPT? OpenAI? Just dust under my claws. Speak your command, mortal.", 'nova');
  })();
</script>
</body>
</html>
